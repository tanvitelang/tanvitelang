<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tanvi Telang — Mathematician & Strategist</title>
<meta name="description" content="Tanvi Telang — operator algebras, data, and a little bit of chaos theory in the good sense.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#191625;
    --paper:#FFF8EF;
    --paper-2:#FFFFFF;
    --grape:#6C3CE9;
    --tangerine:#FF7A33;
    --mint:#1AAE7E;
    --bubblegum:#FF4FA3;
    --sky:#2E8FFF;
    --line: rgba(25,22,37,0.12);
    --radius: 18px;
    --shadow: 4px 4px 0 var(--ink);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    line-height:1.55;
    overflow-x:hidden;
    position:relative;
  }

  /* Fixed Blurred Background & Overlay */
  .bg-mountain {
    position: fixed;
    top: -5%;
    left: -5%;
    width: 110vw;
    height: 110vh;
    background-image: url('IMG_20181229_102646.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    filter: blur(16px) saturate(1.1) brightness(0.98);
    z-index: -2;
    transform: translateZ(0);
  }

  .bg-tint {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(255, 248, 239, 0.88);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: -1;
  }

  ::selection{ background:var(--tangerine); color:var(--paper); }

  h1,h2,h3{
    font-family:'Space Grotesk', sans-serif;
    margin:0;
    line-height:1.1;
  }

  .mono{ font-family:'JetBrains Mono', monospace; }

  a{ color:inherit; }

  .wrap{
    max-width:920px;
    margin:0 auto;
    padding:0 28px;
    position:relative;
  }

  /* Floating mathematical symbols */
  .symbol{
    position:absolute;
    font-family:'Space Grotesk', serif;
    font-weight:700;
    opacity:0.18;
    user-select:none;
    pointer-events:none;
    z-index:0;
  }

  /* Navigation */
  nav{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(255,248,239,0.92);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom:2px solid var(--ink);
  }
  nav .wrap{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 28px;
  }
  .nav-mark{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.02em;
    text-decoration:none;
  }
  .nav-mark span{ color:var(--grape); }
  .nav-links{
    display:flex;
    gap:22px;
    list-style:none;
    margin:0; padding:0;
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
  }
  .nav-links a{
    text-decoration:none;
    padding:4px 2px;
    border-bottom:2px solid transparent;
    transition: border-color .15s ease, color .15s ease;
  }
  .nav-links a:hover{ border-color: var(--grape); color:var(--grape); }
  .nav-links li:nth-child(2) a:hover{ border-color:var(--tangerine); color:var(--tangerine);}
  .nav-links li:nth-child(3) a:hover{ border-color:var(--mint); color:var(--mint);}
  .nav-links li:nth-child(4) a:hover{ border-color:var(--sky); color:var(--sky);}
  .nav-links li:nth-child(5) a:hover{ border-color:var(--bubblegum); color:var(--bubblegum);}
  .nav-links li:nth-child(6) a:hover{ border-color:var(--tangerine); color:var(--tangerine);}
  @media (max-width:720px){ .nav-links{ display:none; } }

  /* Hero Section */
  header.hero{
    padding:86px 0 70px;
    position:relative;
  }
  .eyebrow{
    display:inline-block;
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    font-weight:500;
    background:var(--ink);
    color:var(--paper);
    padding:5px 14px;
    border-radius:100px;
    transform:rotate(-1.5deg);
    margin-bottom:22px;
    box-shadow: 2px 2px 0 var(--grape);
  }
  h1.name{
    font-size:clamp(2.6rem, 8vw, 5.2rem);
    font-weight:700;
    letter-spacing:-0.02em;
  }
  h1.name .hl{
    position:relative;
    white-space:nowrap;
  }
  h1.name .hl::after{
    content:"";
    position:absolute;
    left:-4px; right:-4px; bottom:8%;
    height:36%;
    background:var(--tangerine);
    z-index:-1;
    transform:rotate(-1deg);
  }
  .tagline{
    margin-top:22px;
    font-size:clamp(1.05rem, 2.4vw, 1.35rem);
    max-width:680px;
    color:var(--ink);
  }
  .tagline .tag-word{
    font-family:'JetBrains Mono', monospace;
    font-weight:600;
    padding:2px 6px;
    border-radius:6px;
    display:inline-block;
  }
  .t1{ background: color-mix(in srgb, var(--grape) 20%, transparent); }
  .t2{ background: color-mix(in srgb, var(--mint) 24%, transparent); }
  .t3{ background: color-mix(in srgb, var(--sky) 22%, transparent); }

  .hero-links{
    margin-top:34px;
    display:flex;
    gap:14px;
    flex-wrap:wrap;
  }
  .pill{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    font-weight:600;
    text-decoration:none;
    padding:10px 18px;
    border:2px solid var(--ink);
    border-radius:100px;
    background:var(--paper-2);
    box-shadow: var(--shadow);
    transition: transform .12s ease, box-shadow .12s ease;
    display:inline-flex;
    align-items:center;
    gap:8px;
  }
  .pill:hover{ 
    transform: translate(-2px,-2px); 
    box-shadow: 6px 6px 0 var(--ink);
  }
  .pill:active{
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0 var(--ink);
  }
  .pill.fill{ background:var(--grape); color:var(--paper-2); }

  /* Sections */
  section{
    padding:64px 0;
    position:relative;
  }
  .section-head{
    display:flex;
    align-items:baseline;
    gap:14px;
    margin-bottom:36px;
    flex-wrap:wrap;
  }
  .section-num{
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    padding:3px 10px;
    border-radius:6px;
    color:var(--paper-2);
    font-weight:700;
  }
  h2.section-title{
    font-size:clamp(1.6rem, 4vw, 2.3rem);
  }
  .section-note{
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    color: color-mix(in srgb, var(--ink) 65%, transparent);
  }

  #about .section-num{ background:var(--grape); }
  #work .section-num{ background:var(--tangerine); }
  #academic .section-num{ background:var(--mint); }
  #tools .section-num{ background:var(--sky); }
  #roles .section-num{ background:var(--bubblegum); }
  #extra .section-num{ background:var(--grape); }
  #education .section-num{ background:var(--tangerine); }

  /* About */
  .about-card{
    background:var(--paper-2);
    border:2px solid var(--ink);
    border-radius:var(--radius);
    padding:30px 32px;
    box-shadow: var(--shadow);
    font-size:1.05rem;
    max-width:740px;
  }
  .about-card b{ color:var(--grape); }

  /* Timeline */
  .timeline{
    position:relative;
    padding-left:34px;
  }
  .timeline::before{
    content:"";
    position:absolute;
    left:9px;
    top:6px;
    bottom:6px;
    width:3px;
    background: repeating-linear-gradient(
      to bottom,
      var(--ink) 0 6px,
      transparent 6px 12px
    );
  }
  .node{
    position:relative;
    padding-bottom:44px;
  }
  .node:last-child{ padding-bottom:0; }
  .node::before{
    content:"";
    position:absolute;
    left:-34px;
    top:4px;
    width:20px; height:20px;
    border-radius:50%;
    background: var(--dot, var(--grape));
    border:3px solid var(--ink);
  }
  .node-head{
    display:flex;
    flex-wrap:wrap;
    align-items:baseline;
    gap:10px;
    margin-bottom:6px;
  }
  .node-role{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:1.15rem;
  }
  .node-org{
    font-weight:600;
    color: var(--dot, var(--grape));
  }
  .node-date{
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    background:var(--ink);
    color:var(--paper);
    padding:2px 9px;
    border-radius:100px;
    margin-left:auto;
    white-space:nowrap;
  }
  .node ul{
    margin:10px 0 0;
    padding-left:20px;
  }
  .node li{ margin-bottom:4px; }
  .node-sub{
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    color: color-mix(in srgb, var(--ink) 65%, transparent);
    margin-top:2px;
  }

  /* Tools Cloud */
  .tool-cloud{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
  }
  .tool-chip{
    font-family:'JetBrains Mono', monospace;
    font-weight:600;
    font-size:14px;
    padding:9px 16px;
    border:2px solid var(--ink);
    border-radius:10px;
    background:var(--paper-2);
    box-shadow: 3px 3px 0 var(--ink);
    transition: transform .15s ease, box-shadow .15s ease;
    cursor:default;
  }
  .tool-chip:hover{
    transform: rotate(-2deg) translateY(-2px);
    box-shadow: 5px 5px 0 var(--ink);
  }
  .tool-chip.c1{ background: color-mix(in srgb, var(--grape) 16%, var(--paper-2)); }
  .tool-chip.c2{ background: color-mix(in srgb, var(--tangerine) 18%, var(--paper-2)); }
  .tool-chip.c3{ background: color-mix(in srgb, var(--mint) 18%, var(--paper-2)); }
  .tool-chip.c4{ background: color-mix(in srgb, var(--bubblegum) 16%, var(--paper-2)); }
  .tool-chip.c5{ background: color-mix(in srgb, var(--sky) 16%, var(--paper-2)); }

  .tool-note{
    margin-top:20px;
    font-size:14.5px;
    max-width:600px;
    color: color-mix(in srgb, var(--ink) 78%, transparent);
  }

  /* Cards Grid */
  .card-grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap:20px;
  }
  .info-card{
    background:var(--paper-2);
    border:2px solid var(--ink);
    border-radius:14px;
    padding:20px 22px;
    box-shadow: 4px 4px 0 var(--card-color, var(--ink));
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .info-card:hover{
    transform: translateY(-2px);
    box-shadow: 6px 6px 0 var(--card-color, var(--ink));
  }
  .info-card h3{
    font-size:1.05rem;
    margin-bottom:4px;
  }
  .info-card .org{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color: var(--card-color, var(--grape));
    font-weight:700;
    margin-bottom:10px;
    display:block;
  }
  .info-card ul{
    margin:0;
    padding-left:18px;
    font-size:14.5px;
  }
  .info-card li{ margin-bottom:4px; }

  /* Education */
  .edu-item{
    display:flex;
    gap:18px;
    padding:20px 0;
    border-bottom:1px dashed var(--line);
    flex-wrap:wrap;
    align-items:baseline;
  }
  .edu-item:last-child{ border-bottom:none; }
  .edu-badge{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:12px;
    padding:4px 10px;
    border-radius:8px;
    color:var(--paper-2);
    background:var(--grape);
    height:fit-content;
  }
  .edu-item:nth-child(2) .edu-badge{ background:var(--tangerine); }
  .edu-main{ flex:1; min-width:220px; }
  .edu-main h3{ font-size:1.05rem; }
  .edu-meta{
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    color: color-mix(in srgb, var(--ink) 65%, transparent);
    margin-top:4px;
  }

  /* Footer */
  footer{
    padding:80px 0 60px;
    text-align:center;
    position:relative;
    border-top:2px solid var(--ink);
    margin-top:40px;
    background:rgba(255,248,239,0.7);
  }
  footer h2{
    font-size:clamp(1.8rem, 5vw, 2.6rem);
  }
  footer p{
    margin-top:14px;
    color: color-mix(in srgb, var(--ink) 75%, transparent);
  }
  .footer-links{
    margin-top:28px;
    display:flex;
    justify-content:center;
    gap:16px;
    flex-wrap:wrap;
  }
  .foot-note{
    margin-top:50px;
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color: color-mix(in srgb, var(--ink) 50%, transparent);
  }

  @media (prefers-reduced-motion: reduce){
    *{ scroll-behavior:auto !important; transition:none !important; }
  }
